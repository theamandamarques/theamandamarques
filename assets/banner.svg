<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <rect id="bgRect" width="1200" height="360" rx="18"/>
  <radialGradient id="space" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(610 170) rotate(90) scale(310 720)"><stop stop-color="#11131C"/><stop offset="1" stop-color="#020204"/></radialGradient>
  <linearGradient id="rainbow" x1="80" y1="70" x2="1110" y2="290" gradientUnits="userSpaceOnUse"><stop stop-color="#FF2A2A"/><stop offset=".18" stop-color="#FF8A00"/><stop offset=".36" stop-color="#FFE600"/><stop offset=".52" stop-color="#20E0A0"/><stop offset=".68" stop-color="#22A7FF"/><stop offset=".84" stop-color="#743BFF"/><stop offset="1" stop-color="#FF2AA9"/></linearGradient>
  <linearGradient id="rainbow2" x1="50" y1="290" x2="1150" y2="30" gradientUnits="userSpaceOnUse"><stop stop-color="#743BFF"/><stop offset=".2" stop-color="#22A7FF"/><stop offset=".4" stop-color="#20E0A0"/><stop offset=".6" stop-color="#FFE600"/><stop offset=".8" stop-color="#FF5A00"/><stop offset="1" stop-color="#FF2AA9"/></linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2"/></filter>
</defs>
<use href="#bgRect" fill="url(#space)"/>
<!-- colorful fluid space ribbons -->
<path d="M-80 265 C 80 80, 170 95, 300 220 S 510 345, 650 205 S 865 45, 1030 155 S 1170 280, 1280 85" stroke="url(#rainbow)" stroke-width="38" opacity=".24" filter="url(#glow)"/>
<path d="M-80 265 C 80 80, 170 95, 300 220 S 510 345, 650 205 S 865 45, 1030 155 S 1170 280, 1280 85" stroke="url(#rainbow)" stroke-width="15" opacity=".88"/>
<path d="M-90 225 C 70 35, 210 120, 335 205 S 530 320, 690 180 S 860 25, 1010 115 S 1170 225, 1290 50" stroke="url(#rainbow2)" stroke-width="7" opacity=".82"/>
<path d="M-80 305 C 120 155, 220 180, 360 275 S 570 330, 710 235 S 890 95, 1040 190 S 1180 300, 1280 160" stroke="url(#rainbow2)" stroke-width="4" opacity=".7" filter="url(#soft)"/>
